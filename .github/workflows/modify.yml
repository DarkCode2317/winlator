name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Download winlator 7.1 source code
        run: |
          wget https://github.com/brunodev85/winlator/archive/refs/tags/v7.0.0.zip

      - name: Commit
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"

          git add .
          git commit -m "Modify repo"
          git push origin android