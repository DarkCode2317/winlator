name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create android branch
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"

          git checkout -b android

          git push origin android