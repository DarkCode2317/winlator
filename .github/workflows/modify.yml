name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Download winlator 7.1 source code zip file
        run: |
          wget -O winlator.zip https://github.com/brunodev85/winlator/archive/refs/tags/v7.1.0.zip

      - name: Extract
        run: |
          unzip winlator.zip
          rm winlator.zip
      
      - name: Delete LFS
        run: |
          find . -name .gitattributes -delete

      - name: Move content to current
        run: |
          mv winlator-7.1.0/* winlator-7.1.0/.[!.]* winlator-7.1.0/..?* . 2>/dev/null || true
          rm -rf winlator-7.1.0

      - name: Commit
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"

          git add .
          git commit -m "Modify repo"
          git push origin android --force