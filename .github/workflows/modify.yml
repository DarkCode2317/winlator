name: Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: winlator-lfs-${{ runner.os }}

      - name: Check LFS cache
        run: |
          du -sh .git/lfs/objects

      - name: Download LFS
        run: |
          git lfs install
          git lfs pull

      - name: Extract imagefs.txz
        if: false
        run: |
          mkdir imagefs
          tar -xf app/src/main/assets/imagefs.txz -C imagefs

      - name: Remove 64 of imagefs
        if: false
        run: |
          rm -rf \
          imagefs/opt/wine/lib/wine/x86_64-windows \
          imagefs/opt/wine/lib/wine/x86_64-unix \
          imagefs/usr/lib/aarch64-linux-gnu \
          imagefs/usr/lib/x86_64-linux-gnu \
          imagefs/opt/wine/bin/wine64 \
          imagefs/opt/wine/bin/wine64-preloader

      - name: Zip imagefs
        if: false
        run: |
          cd imagefs
          tar -cf ../imagefs.txz -I "xz -T0 -9e" .
          cd ..
          echo "==Size of imagefs.txz:"
          du -sh imagefs.txz

      - name: Extract ubuntu-prepared.txz
        if: true
        run: |
          mkdir ubuntu-prepared
          tar -xf obb_image_generator/ubuntu-prepared.txz -C ubuntu-prepared

      - name: List 64 of ubuntu-prepared.txz
        if: true
        run: |
          echo && echo "==Removing 64 bit folders:"
          rm -rf \
          ubuntu-prepared/usr/share/gdb/auto-load/usr/lib/aarch64-linux-gnu \
          ubuntu-prepared/usr/lib/aarch64-linux-gnu

          echo && echo "==Files:"
          find ubuntu-prepared -type f -exec file {} + 2>/dev/null | grep -Ei 'ELF 64-bit.*ARM aarch64' | cut -d: -f1


      - name: List 64 of patches.txz
        if: false
        run: |
          tar -tf obb_image_generator/patches.txz | grep -i 64

      - name: List 64 of wine.txz
        if: false
        run: |
          tar -tf obb_image_generator/wine.txz | grep -i 64

      - name: Commit
        if: false
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"

          git add .
          git commit -m "Test"
          git push origin android --force
      