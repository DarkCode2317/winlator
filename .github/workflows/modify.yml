name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Download winlator 7.1 source code zip file
        run: |
          wget -O winlator.zip https://github.com/brunodev85/winlator/archive/refs/tags/v7.1.0.zip

      - name: Extract
        run: |
          unzip winlator.zip
          rm winlator.zip
          find . -name .gitattributes