name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Download gradle
        run: |
          wget \
          https://raw.githubusercontent.com/DarkCode2317/winlator-7.1/vanilla/gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/DarkCode2317/winlator-7.1/vanilla/gradle/wrapper/gradle-wrapper.properties
          mkdir -p gradle/wrapper/
          mv gradle-wrapper.jar gradle/wrapper
          mv gradle-wrapper.properties gradle/wrapper

      - name: Commit
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"

          git add .
          git commit -m "Modify repo"
          git push origin android --force