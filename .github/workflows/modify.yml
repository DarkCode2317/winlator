name: Modify Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Download LFS
        run: |
          rm -rf imagefs
          git lfs install
          git lfs pull

      - name: List 64 of imagefs.txz
        run: |
          tar -tf app/src/main/assets/imagefs.txz | grep -i 64

      - name: Commit
        run: |
          git config user.name "DarkCode2317"
          git config user.email "darkcode2317@gmail.com"

          git add .
          git commit -m "Modify repo"
          git push origin android --force
      